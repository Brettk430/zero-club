    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:image" content="https://zero-club1.vercel.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zero Club — Debt freedom is a habit." />

    <meta name="twitter:image" content="https://zero-club1.vercel.app/og-image.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Structured data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Zero Club",
      "applicationCategory": "FinanceApplication",
      "description": "Debt payoff accountability platform. Track commitments, check in monthly, build streaks, and reach zero debt faster with AI coaching.",
      "url": "https://zero-club1.vercel.app",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "name": "Free"
        },
        {
          "@type": "Offer",
          "price": "9",
          "priceCurrency": "USD",
          "name": "Premium",
          "billingIncrement": "month"
        }
      ],
      "featureList": [
        "Debt avalanche calculator",
        "Monthly accountability commitments",
        "AI behavior coach",
        "Streak tracking",
        "Accountability community"
      ]
    }
    </script>

    <!-- FAQ structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the debt avalanche method?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The debt avalanche method pays off your highest-interest debt first while making minimum payments on all others. When the highest-rate debt is paid off, you roll that payment to the next highest. This minimizes total interest paid."
          }
        },
        {
          "@type": "Question",
          "name": "How does Zero Club help with debt payoff?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zero Club is an accountability platform for debt payoff. You set monthly commitments, check in each month, and build streaks. An AI coach named Miles helps you stay on track, find extra money, and recover from setbacks."
          }
        },
        {
          "@type": "Question",
          "name": "Is Zero Club free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Zero Club has a free tier that includes the debt calculator, journey scoreboard, monthly commitments, and streak tracking. Premium ($9/month) adds unlimited AI coaching sessions and accountability circles."
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  </head>
