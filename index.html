    <!-- Structured data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Zero Club",
      "applicationCategory": "FinanceApplication",
      "description": "The social club for becoming debt-free. Track your journey to $0, start a club with your people, and celebrate every milestone together.",
      "url": "https://zero-club1.vercel.app",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "name": "Free while we build"
      },
      "featureList": [
        "Debt payoff tracker",
        "Private and public clubs",
        "Club standings and leaderboards",
        "Milestones and badges",
        "Shareable progress cards"
      ]
    }
    </script>

    <!-- FAQ structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Zero Club?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The social club for becoming debt-free. You track one number falling to zero, and you do it with your people rather than alone."
          }
        },
        {
          "@type": "Question",
          "name": "How does Zero Club work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You name one number — everything you owe — and log every payment against it. Progress becomes badges and streaks, and clubs let you chase zero alongside people you know."
          }
        },
        {
          "@type": "Question",
          "name": "Is Zero Club free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — Zero Club is free while we build it. Nothing is sold in the app."
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
